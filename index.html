  <style>

    *{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% -10%,rgba(255,107,53,.1),transparent 34%),var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif;-webkit-tap-highlight-color:transparent}button,input{font:inherit;color:inherit;touch-action:manipulation}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--orange);outline-offset:3px}
    .shell{width:min(100%,720px);min-height:100dvh;margin:auto;padding:max(18px,env(safe-area-inset-top)) 22px max(22px,env(safe-area-inset-bottom));display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:750;letter-spacing:-.03em}.logo{width:29px;height:29px;border-radius:8px;background:var(--orange);display:flex;align-items:end;justify-content:center;gap:2px;padding:7px}.logo i{display:block;width:3px;border-radius:3px;background:#20160f}.logo i:nth-child(1){height:7px}.logo i:nth-child(2){height:14px}.logo i:nth-child(3){height:10px}.actions{display:flex;align-items:center;gap:8px}.wake{height:31px;display:flex;align-items:center;gap:7px;padding:0 10px;border:1px solid var(--line);border-radius:99px;color:var(--muted);font-size:10px}.wake i{width:6px;height:6px;border-radius:50%;background:#6d7169}.wake.on i{background:#75c96d;box-shadow:0 0 10px rgba(117,201,109,.7)}.settings{width:32px;height:32px;padding:0 0 8px;border:1px solid var(--line);border-radius:50%;background:transparent;color:var(--muted);letter-spacing:1px}
    .metro{flex:1;min-height:505px;padding:clamp(38px,7vh,65px) 0 28px;display:flex;flex-direction:column;align-items:center}.meter-row{width:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}.plain{border:0;background:transparent;color:var(--muted);font-size:12px}.meter{text-align:left}.sound{text-align:right}.plain b{margin-left:4px;color:#5f625c}.lights{display:flex;gap:11px;align-items:center}.lights.many{gap:5px}.light{width:7px;height:7px;padding:0;border:0;border-radius:50%;background:#555850;transition:.08s}.light.a0{opacity:.23;background:transparent;box-shadow:inset 0 0 0 1px #777}.light.a2{background:var(--soft)}.light.now{transform:scale(1.65);background:var(--orange);box-shadow:0 0 18px rgba(255,107,53,.8)}
    .tempo{width:100%;max-width:500px;margin-top:clamp(32px,7vh,62px);display:grid;grid-template-columns:46px minmax(180px,1fr) 46px;align-items:center;gap:12px}.step{appearance:none;-webkit-appearance:none;display:grid;place-items:center;flex:0 0 auto;width:46px;min-width:46px;height:46px;min-height:46px;aspect-ratio:1/1;padding:0;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.018);color:var(--muted);font-size:25px;font-weight:300;line-height:1}.readout{display:flex;flex-direction:column;align-items:center;cursor:ew-resize;user-select:none}.number{width:100%;padding:0;border:0;background:transparent;outline:0;text-align:center;color:var(--ink);font-size:clamp(92px,26vw,154px);font-weight:650;line-height:.82;letter-spacing:-.095em;font-variant-numeric:tabular-nums}.number::-webkit-inner-spin-button,.number::-webkit-outer-spin-button{appearance:none}.term{margin-top:19px;color:var(--soft);font-size:10px;font-weight:650;letter-spacing:.16em}
    .range{position:relative;width:calc(100% - 34px);max-width:520px;height:20px;margin-top:40px}.range:before{content:"";position:absolute;top:9px;left:0;right:0;height:2px;background:var(--line)}.range input{appearance:none;position:absolute;z-index:2;inset:0;width:100%;height:20px;margin:0;background:transparent}.range input::-webkit-slider-thumb{appearance:none;width:18px;height:18px;border:4px solid var(--orange);border-radius:50%;background:var(--bg);box-shadow:0 0 0 5px rgba(255,107,53,.1)}.fill{position:absolute;top:9px;left:0;height:2px;background:var(--orange)}.scale{width:calc(100% - 34px);max-width:520px;display:flex;justify-content:space-between;color:#5e615a;font-size:9px;font-variant-numeric:tabular-nums}
    .transport{display:grid;grid-template-columns:76px 108px 76px;gap:clamp(22px,8vw,52px);align-items:center;margin-top:clamp(36px,7vh,58px)}.side{display:flex;flex-direction:column;align-items:center;gap:5px;border:0;background:transparent}.side span{font-size:14px;font-weight:650}.side small{color:var(--muted);font-size:9px;white-space:nowrap}.timer span{font-size:20px;font-weight:400}.play{width:108px;height:108px;border:0;border-radius:50%;background:var(--orange);box-shadow:0 12px 38px rgba(255,107,53,.18),inset 0 1px 1px rgba(255,255,255,.25);display:grid;place-items:center}.play i{margin-left:7px;width:0;height:0;border-top:13px solid transparent;border-bottom:13px solid transparent;border-left:20px solid #1d1713}.play.playing i{width:20px;height:24px;margin:0;border:0;border-left:7px solid #1d1713;border-right:7px solid #1d1713}
    .quick{border-top:1px solid var(--line);padding-top:19px}.quick-head{display:flex;justify-content:space-between;align-items:center}.quick-head p{margin:0;font-size:13px;font-weight:650}.quick-head small{display:block;margin-top:3px;color:#5e615a;font-size:8px;letter-spacing:.14em}.quick-head button{border:0;background:transparent;color:var(--muted);font-size:10px}.subs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.subs button{min-height:61px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.018);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.subs button.on{border-color:rgba(255,107,53,.7);background:rgba(255,107,53,.08)}.subs strong{font:400 20px/22px Georgia,serif}.subs span{color:var(--muted);font-size:9px}.subs .on span{color:var(--soft)}.hint{margin:17px 0 0;text-align:center;color:#555850;font-size:9px}
    .flash{position:fixed;z-index:10;inset:0;pointer-events:none;background:rgba(255,107,53,.12);animation:out .17s ease-out forwards}.flash.strong{background:rgba(255,107,53,.21)}@keyframes out{to{opacity:0}}
    dialog{width:min(100%,720px);max-height:min(86dvh,760px);margin:auto 0 0;overflow:auto;padding:8px 22px max(24px,env(safe-area-inset-bottom));border:1px solid var(--line);border-bottom:0;border-radius:27px 27px 0 0;background:var(--panel);color:var(--ink);box-shadow:0 -20px 60px rgba(0,0,0,.25)}dialog::backdrop{background:var(--shade);backdrop-filter:blur(7px)}dialog[open]{animation:up .22s cubic-bezier(.2,.75,.25,1)}@keyframes up{from{transform:translateY(30px);opacity:.5}}.handle{width:38px;height:4px;margin:2px auto 18px;border-radius:4px;background:var(--line)}.sheet-title{display:flex;align-items:start;justify-content:space-between;margin-bottom:19px}.sheet-title h2{margin:0;font-size:21px;letter-spacing:-.035em}.sheet-title p{margin:5px 0 0;color:var(--muted);font-size:11px}.close{width:34px;height:34px;border:0;border-radius:50%;background:var(--raised);color:var(--muted);font-size:23px;line-height:1}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.grid button,.timers button{min-height:66px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.018);display:flex;flex-direction:column;align-items:center;justify-content:center}.grid strong,.timers strong{font-size:16px}.grid span,.timers span{margin-top:3px;color:var(--muted);font-size:9px}.grid button.on,.timers button.on{border-color:var(--orange);background:rgba(255,107,53,.09);color:var(--soft)}.timers{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.timers button{min-height:88px}.timers strong{font-size:25px}.sound-list{display:grid;gap:8px}.sound-list button{display:grid;grid-template-columns:42px 1fr auto;align-items:center;min-height:56px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.018);text-align:left}.sound-list button.on{border-color:var(--orange);background:rgba(255,107,53,.08)}.wave{display:flex;align-items:center;gap:2px}.wave i{width:2px;height:7px;background:var(--muted)}.wave i:nth-child(2){height:18px}.wave i:nth-child(3){height:12px}.sound-list button>small{color:var(--muted);font-size:9px;text-transform:uppercase}
    .accent-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(58px,1fr));gap:8px}.accent-grid button{min-height:68px;border:1px solid var(--line);border-radius:12px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center}.accent-grid button.a2{border-color:var(--orange);color:var(--orange)}.accent-grid button.a0{opacity:.4}.accent-grid span{margin-top:3px;color:var(--muted);font-size:9px}.legend{display:flex;justify-content:center;gap:21px;margin:18px 0;color:var(--muted);font-size:10px}.wide{width:100%;min-height:45px;border:1px solid var(--line);border-radius:11px;background:transparent;color:var(--muted);font-size:11px}
    .settings-list{display:grid;gap:9px}.row,.volume,.training,.fav-head{border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.018)}.row{min-height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 14px}.row>span,.volume>span,.fav-head>div{display:flex;flex-direction:column}.row strong,.volume strong,.fav-head strong{font-size:12px}.row small,.volume small,.fav-head small{margin-top:3px;color:var(--muted);font-size:9px}.toggle{appearance:none;width:42px;height:24px;padding:2px;border:0;border-radius:99px;background:#3a3d37}.toggle:after{content:"";display:block;width:20px;height:20px;border-radius:50%;background:#aaa;transition:.15s}.toggle:checked{background:var(--orange)}.toggle:checked:after{transform:translateX(18px);background:#fff}.volume{min-height:74px;padding:11px 14px}.volume>span{flex-direction:row;justify-content:space-between}.volume input{width:100%;margin-top:12px;accent-color:var(--orange)}.training{padding:0 14px 13px}.training .row{padding:0;border:0;background:transparent}.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.fields label{height:38px;display:flex;align-items:center;justify-content:center;gap:3px;border:1px solid var(--line);border-radius:9px;color:var(--muted);font-size:9px}.fields input{width:36px;border:0;background:transparent;text-align:center;font-weight:700}.fav-head{min-height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 14px}.fav-head button{border:0;background:transparent;color:var(--orange);font-size:10px}.favorites{display:grid;gap:6px}.favorite{display:grid;grid-template-columns:1fr 38px;border:1px solid var(--line);border-radius:10px;overflow:hidden}.favorite button{min-height:45px;padding:0 11px;border:0;background:transparent;text-align:left}.favorite .load{display:flex;justify-content:space-between;align-items:center}.favorite span{color:var(--muted);font-size:9px}.favorite .del{border-left:1px solid var(--line);color:var(--muted)}.note,.empty{margin:0;padding:7px 10px 0;text-align:center;color:var(--muted);font-size:9px;line-height:1.6}
    @media(max-height:760px){.metro{min-height:438px;padding-top:27px}.tempo{margin-top:27px}.range{margin-top:28px}.transport{margin-top:28px}.play{width:92px;height:92px}.transport{grid-template-columns:68px 92px 68px}}
    @media(max-width:390px){.shell{padding-inline:16px}.wake{font-size:9px;padding-inline:8px}.tempo{grid-template-columns:40px minmax(160px,1fr) 40px;gap:7px}.step{width:40px;min-width:40px;height:40px;min-height:40px}.transport{gap:18px}.grid{grid-template-columns:repeat(3,1fr)}dialog{padding-inline:16px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div class="brand"><span class="logo"><i></i><i></i><i></i></span><span>拍点</span></div>
      <div class="actions"><span class="wake" id="wake"><i></i><span>播放时常亮</span></span><button class="settings" id="settings" aria-label="设置">•••</button></div>
    </header>
    <section class="metro">
      <div class="meter-row"><button class="plain meter" id="meterBtn">4 / 4 <b>⌄</b></button><div class="lights" id="lights"></div><button class="plain sound" id="soundBtn">经典木鱼 <b>⌄</b></button></div>
      <div class="tempo"><button class="step" id="minus" aria-label="减速">−</button><label class="readout" id="readout"><input class="number" id="bpm" type="number" inputmode="numeric" min="20" max="300" value="120"><span class="term" id="term">BPM · ALLEGRO</span></label><button class="step" id="plus" aria-label="加速">＋</button></div>
      <label class="range"><input id="range" type="range" min="20" max="300" value="120"><span class="fill" id="fill"></span></label><div class="scale"><span>20</span><span>120</span><span>300</span></div>
      <div class="transport"><button class="side" id="tap"><span>TAP</span><small>点击测速</small></button><button class="play" id="play" aria-label="播放"><i></i></button><button class="side timer" id="timer"><span id="timerValue">∞</span><small id="timerLabel">不限时</small></button></div>
    </section>
    <section class="quick"><div class="quick-head"><div><p>节奏细分</p><small>SUBDIVISION</small></div><button id="accentBtn">编辑重音</button></div><div class="subs" id="subs"></div></section>
    <p class="hint">左右滑动数字快速调速 · 点击播放后尝试保持屏幕常亮</p>
  </main>
  <dialog id="sheet"><div class="handle"></div><div class="sheet-title"><div><h2 id="sheetTitle"></h2><p id="sheetSub"></p></div><button class="close" id="close" aria-label="关闭">×</button></div><div id="sheetBody"></div></dialog>
  <script>
  (()=>{
    'use strict';
    const METERS=[['2/4',2,[2]],['3/4',3,[3]],['4/4',4,[4]],['5/4',5,[3,2]],['6/4',6,[3,3]],['7/4',7,[4,3]],['3/8',3,[3]],['5/8',5,[3,2]],['6/8',6,[3,3]],['7/8',7,[2,2,3]],['8/8',8,[3,3,2]],['9/8',9,[3,3,3]],['10/8',10,[3,3,2,2]],['11/8',11,[3,3,3,2]],['12/8',12,[3,3,3,3]],['13/8',13,[3,3,3,2,2]],['15/8',15,[3,3,3,3,3]],['2/2',2,[2]],['3/2',3,[3]],['4/2',4,[4]],['5/16',5,[3,2]],['7/16',7,[2,2,3]],['9/16',9,[3,3,3]],['11/16',11,[3,3,3,2]]];
    const SUBS=[['四分','♩',1],['八分','♫',2],['三连音','♬',3],['十六分','♬',4]];
    const SOUNDS=[['经典木鱼','sine',1160,770,.055],['明亮点击','square',1760,1250,.025],['录音棚','triangle',1320,880,.04],['牛铃','square',640,540,.09],['柔和木块','sine',920,620,.075],['数字脉冲','sawtooth',1500,1000,.018]];
    const $=id=>document.getElementById(id), clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
    const recommended=i=>{const r=Array(METERS[i][1]).fill(1);r[0]=2;let p=0;METERS[i][2].slice(0,-1).forEach(n=>{p+=n;r[p]=2});return r};
    let state={bpm:120,meter:2,sub:0,sound:0,accents:recommended(2),volume:.75,flash:true,theme:'dark',timer:0,training:{on:false,bars:4,add:2,max:180},favorites:[]};
    let ctx=null,playing=false,nextTime=0,beat=0,subBeat=0,bars=0,schedulerId=null,wakeLock=null,timerEnd=0,timerId=null,taps=[],drag=null;
    try{const saved=JSON.parse(localStorage.getItem('paidian-offline')||'null');if(saved)state={...state,...saved,training:{...state.training,...saved.training},accents:Array.isArray(saved.accents)?saved.accents:state.accents,favorites:Array.isArray(saved.favorites)?saved.favorites:[]}}catch(e){}
    const save=()=>{try{localStorage.setItem('paidian-offline',JSON.stringify(state))}catch(e){}};
    const name=b=>b<40?'GRAVE':b<60?'LARGO':b<76?'ADAGIO':b<108?'ANDANTE':b<120?'MODERATO':b<168?'ALLEGRO':b<200?'PRESTO':'PRESTISSIMO';
    const setBpm=v=>{state.bpm=clamp(Math.round(Number(v)||20),20,300);$('bpm').value=state.bpm;$('range').value=state.bpm;$('fill').style.width=((state.bpm-20)/2.8)+'%';$('term').textContent='BPM · '+name(state.bpm);save()};
    function render(){document.documentElement.dataset.theme=state.theme;setBpm(state.bpm);$('meterBtn').innerHTML=METERS[state.meter][0].replace('/',' / ')+' <b>⌄</b>';$('soundBtn').innerHTML=SOUNDS[state.sound][0]+' <b>⌄</b>';$('timerValue').textContent=state.timer||'∞';$('timerLabel').textContent=state.timer?state.timer+'分钟':'不限时';renderLights();$('subs').innerHTML=SUBS.map((s,i)=>`<button data-sub="${i}" class="${i===state.sub?'on':''}"><strong>${s[1]}</strong><span>${s[0]}</span></button>`).join('');$('subs').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.sub=+b.dataset.sub;render();save()})}
    function renderLights(active=-1){const n=METERS[state.meter][1];if(state.accents.length!==n)state.accents=recommended(state.meter);$('lights').className='lights'+(n>9?' many':'');$('lights').innerHTML=state.accents.map((a,i)=>`<button class="light a${a}${i===active?' now':''}" aria-label="第${i+1}拍"></button>`).join('');$('lights').querySelectorAll('button').forEach((b,i)=>b.onclick=()=>{state.accents[i]=(state.accents[i]+1)%3;renderLights();save()})}
    function note(time,accent,isSub){if(!accent||!ctx)return;const s=SOUNDS[state.sound],osc=ctx.createOscillator(),gain=ctx.createGain(),freq=isSub?s[3]*.82:accent===2?s[2]:s[3],level=state.volume*(isSub?.18:accent===2?.9:.48);osc.type=s[1];osc.frequency.setValueAtTime(freq,time);osc.frequency.exponentialRampToValueAtTime(Math.max(110,freq*.72),time+s[4]);gain.gain.setValueAtTime(Math.max(.0001,level),time);gain.gain.exponentialRampToValueAtTime(.0001,time+s[4]);osc.connect(gain).connect(ctx.destination);osc.start(time);osc.stop(time+s[4]+.015)}
    function schedule(){if(!playing||!ctx)return;while(nextTime<ctx.currentTime+.11){const div=SUBS[state.sub][2],currentBeat=beat,currentSub=subBeat,accent=state.accents[currentBeat]??1;note(nextTime,currentSub===0?accent:accent===0?0:1,currentSub!==0);if(currentSub===0){const delay=Math.max(0,(nextTime-ctx.currentTime)*1000);setTimeout(()=>{if(!playing)return;renderLights(currentBeat);if(state.flash){const f=document.createElement('div');f.className='flash'+(currentBeat===0?' strong':'');document.body.appendChild(f);setTimeout(()=>f.remove(),190)}},delay)}nextTime+=60/state.bpm/div;subBeat++;if(subBeat>=div){subBeat=0;beat++;if(beat>=METERS[state.meter][1]){beat=0;bars++;if(state.training.on&&bars>=state.training.bars&&state.bpm<state.training.max){bars=0;setBpm(Math.min(state.bpm+state.training.add,state.training.max))}}}}}
    async function requestWake(){if(!('wakeLock'in navigator)){setWake('此浏览器不支持常亮',false);return}try{wakeLock=await navigator.wakeLock.request('screen');setWake('屏幕常亮',true);wakeLock.addEventListener('release',()=>{if(playing)setWake('常亮已暂停',false)})}catch(e){setWake('常亮不可用',false)}}
    async function releaseWake(){try{await wakeLock?.release()}catch(e){}wakeLock=null;setWake('播放时常亮',false)}
    function setWake(text,on){$('wake').classList.toggle('on',on);$('wake').querySelector('span').textContent=text}
    async function start(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC){alert('当前浏览器不支持网页音频');return}if(!ctx)ctx=new AC();await ctx.resume();playing=true;beat=0;subBeat=0;bars=0;nextTime=ctx.currentTime+.055;$('play').classList.add('playing');$('play').setAttribute('aria-label','停止');if(state.timer){timerEnd=Date.now()+state.timer*60000;timerId=setInterval(updateTimer,250)}requestWake();schedule();schedulerId=setInterval(schedule,25)}
    function stop(){playing=false;clearInterval(schedulerId);clearInterval(timerId);schedulerId=timerId=null;$('play').classList.remove('playing');$('play').setAttribute('aria-label','播放');renderLights();$('timerValue').textContent=state.timer||'∞';$('timerLabel').textContent=state.timer?state.timer+'分钟':'不限时';releaseWake()}
    function updateTimer(){const left=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));$('timerValue').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');$('timerLabel').textContent='剩余时间';if(!left)stop()}
    function toggle(){playing?stop():start()}
    function openSheet(type){const titles={meter:['选择拍号',METERS.length+' 种常用与复合拍号'],sound:['选择音色','点击即可试听'],timer:['定时训练','时间到后自动停止'],accent:['编辑重音','点击切换重音、弱音和静音'],settings:['设置','训练与个性化选项']};$('sheetTitle').textContent=titles[type][0];$('sheetSub').textContent=titles[type][1];const body=$('sheetBody');
      if(type==='meter'){body.innerHTML='<div class="grid">'+METERS.map((m,i)=>`<button data-i="${i}" class="${i===state.meter?'on':''}"><strong>${m[0]}</strong><span>${m[2].join('+')}</span></button>`).join('')+'</div>';body.querySelectorAll('button').forEach(b=>b.onclick=()=>{state.meter=+b.dataset.i;state.accents=recommended(state.meter);beat=0;save();render();$('sheet').close()})}
      if(type==='sound'){body.innerHTML='<div class="sound-list">'+SOUNDS.map((s,i)=>`<button data-i="${i}" class="${i===state.sound?'on':''}"><span class="wave"><i></i><i></i><i></i></span><strong>${s[0]}</strong><small>${s[1]}</small></button>`).join('')+'</div>';body.querySelectorAll('button').forEach(b=>b.onclick=async()=>{state.sound=+b.dataset.i;save();render();const AC=window.AudioContext||window.webkitAudioContext;if(!ctx)ctx=new AC();await ctx.resume();note(ctx.currentTime+.02,2,false);openSheet('sound')})}
      if(type==='timer'){const opts=[0,5,10,15,20,30];body.innerHTML='<div class="timers">'+opts.map(n=>`<button data-n="${n}" class="${n===state.timer?'on':''}"><strong>${n||'∞'}</strong><span>${n?'分钟':'不限时'}</span></button>`).join('')+'</div>';body.querySelectorAll('button').forEach(b=>b.onclick=()=>{state.timer=+b.dataset.n;save();render();$('sheet').close()})}
      if(type==='accent'){body.innerHTML='<div class="accent-grid">'+state.accents.map((a,i)=>`<button data-i="${i}" class="a${a}"><strong>${i+1}</strong><span>${a===2?'重音':a===1?'弱音':'静音'}</span></button>`).join('')+'</div><div class="legend">橙色：重音　灰色：弱音　空心：静音</div><button class="wide" id="resetAccent">恢复推荐重音</button>';body.querySelectorAll('.accent-grid button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;state.accents[i]=(state.accents[i]+1)%3;save();renderLights();openSheet('accent')});$('resetAccent').onclick=()=>{state.accents=recommended(state.meter);save();renderLights();openSheet('accent')}}
      if(type==='settings')renderSettings();
      if(!$('sheet').open)$('sheet').showModal();
    }
    function renderSettings(){const body=$('sheetBody');body.innerHTML=`<div class="settings-list"><label class="volume"><span><strong>节拍音量</strong><small id="volText">${Math.round(state.volume*100)}%</small></span><input id="volume" type="range" min="0" max="1" step=".01" value="${state.volume}"></label><label class="row"><span><strong>屏幕闪光</strong><small>用视觉提示每一拍</small></span><input id="flashToggle" class="toggle" type="checkbox" ${state.flash?'checked':''}></label><label class="row"><span><strong>浅色界面</strong><small>适合明亮环境</small></span><input id="themeToggle" class="toggle" type="checkbox" ${state.theme==='light'?'checked':''}></label><div class="training"><label class="row"><span><strong>渐进加速训练</strong><small>按小节自动提高速度</small></span><input id="trainToggle" class="toggle" type="checkbox" ${state.training.on?'checked':''}></label><div class="fields"><label>每<input id="bars" type="number" min="1" max="32" value="${state.training.bars}">小节</label><label>增加<input id="add" type="number" min="1" max="20" value="${state.training.add}">BPM</label><label>上限<input id="max" type="number" min="40" max="300" value="${state.training.max}"></label></div></div><div class="fav-head"><div><strong>常用组合</strong><small>保存在本机</small></div><button id="saveFav">＋ 保存当前</button></div><div class="favorites" id="favorites"></div><p class="note">本文件完全离线运行。屏幕常亮取决于 iPhone 是否允许本地网页使用该功能。</p></div>`;
      $('volume').oninput=e=>{state.volume=+e.target.value;$('volText').textContent=Math.round(state.volume*100)+'%';save()};$('flashToggle').onchange=e=>{state.flash=e.target.checked;save()};$('themeToggle').onchange=e=>{state.theme=e.target.checked?'light':'dark';document.documentElement.dataset.theme=state.theme;save()};$('trainToggle').onchange=e=>{state.training.on=e.target.checked;save()};['bars','add','max'].forEach(id=>$(id).onchange=e=>{const ranges={bars:[1,32],add:[1,20],max:[40,300]},r=ranges[id];state.training[id]=clamp(+e.target.value,r[0],r[1]);save()});$('saveFav').onclick=()=>{state.favorites.unshift({id:Date.now(),name:METERS[state.meter][0]+' · '+state.bpm+' BPM',bpm:state.bpm,meter:state.meter,sub:state.sub});state.favorites=state.favorites.slice(0,6);save();renderSettings()};renderFavorites()}
    function renderFavorites(){const el=$('favorites');if(!state.favorites.length){el.innerHTML='<p class="empty">还没有保存的组合</p>';return}el.innerHTML=state.favorites.map(f=>`<div class="favorite"><button class="load" data-id="${f.id}"><strong>${f.name}</strong><span>${SUBS[f.sub][0]}</span></button><button class="del" data-id="${f.id}" aria-label="删除">×</button></div>`).join('');el.querySelectorAll('.load').forEach(b=>b.onclick=()=>{const f=state.favorites.find(x=>x.id==b.dataset.id);if(!f)return;state.bpm=f.bpm;state.meter=f.meter;state.sub=f.sub;state.accents=recommended(f.meter);save();render();$('sheet').close()});el.querySelectorAll('.del').forEach(b=>b.onclick=()=>{state.favorites=state.favorites.filter(x=>x.id!=b.dataset.id);save();renderSettings()})}
    $('minus').onclick=()=>setBpm(state.bpm-1);$('plus').onclick=()=>setBpm(state.bpm+1);$('bpm').onchange=e=>setBpm(e.target.value);$('range').oninput=e=>setBpm(e.target.value);$('play').onclick=toggle;$('meterBtn').onclick=()=>openSheet('meter');$('soundBtn').onclick=()=>openSheet('sound');$('timer').onclick=()=>openSheet('timer');$('accentBtn').onclick=()=>openSheet('accent');$('settings').onclick=()=>openSheet('settings');$('close').onclick=()=>$('sheet').close();$('sheet').addEventListener('click',e=>{if(e.target===$('sheet'))$('sheet').close()});
    $('tap').onclick=()=>{const now=performance.now();taps=taps.filter(t=>now-t<2000);taps.push(now);taps=taps.slice(-6);if(taps.length>1){const intervals=taps.slice(1).map((t,i)=>t-taps[i]),avg=intervals.reduce((a,b)=>a+b,0)/intervals.length;setBpm(60000/avg)}if(navigator.vibrate)navigator.vibrate(8)};
    $('readout').onpointerdown=e=>{drag={x:e.clientX,bpm:state.bpm};e.currentTarget.setPointerCapture(e.pointerId)};$('readout').onpointermove=e=>{if(drag)setBpm(drag.bpm+(e.clientX-drag.x)/4)};$('readout').onpointerup=()=>drag=null;
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&playing&&!wakeLock)requestWake()});window.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||$('sheet').open)return;if(e.code==='Space'){e.preventDefault();toggle()}if(e.code==='ArrowUp')setBpm(state.bpm+1);if(e.code==='ArrowDown')setBpm(state.bpm-1)});window.addEventListener('pagehide',stop);
    render();
  })();
  </script>
</body>
</html>
